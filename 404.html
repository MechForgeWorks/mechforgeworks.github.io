<!DOCTYPE html>

<html lang="en-GB">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    name="color-scheme"
    content="dark">

  <meta
    name="theme-color"
    content="#0d0e10">

  <title>Page not found | Scott Collins MEng</title>

  <!-- Absolute paths: this page is served for any missing URL, at any depth -->
  <link
    rel="icon"
    href="/favicon-32.png"
    sizes="32x32"
    type="image/png">

  <link
    rel="icon"
    href="/favicon.svg"
    type="image/svg+xml">

  <link
    rel="apple-touch-icon"
    href="/apple-touch-icon.png">

  <link
    rel="stylesheet"
    href="/css/style.css">

  <meta
    name="robots"
    content="noindex">

  <script
    src="/js/main.js"
    defer></script>

</head>

<body data-line="stopped">

  <!-- The same line as the homepage, stopped, with its warning light on -->
  <canvas class="line" id="line" aria-hidden="true"></canvas>

  <main class="page">

    <div class="intro">

      <h1>Page not found</h1>

      <p>There's nothing at this address.</p>

    </div>

    <div class="bottom">

      <p class="legal">Error 404</p>

      <div class="actions">
        <a class="cta" href="/">Back to the homepage</a>
      </div>

    </div>

  </main>

</body>
</html>
