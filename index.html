<!DOCTYPE html>

<html lang="en-GB">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; media-src 'self'; connect-src 'self'; form-action https://formspree.io; base-uri 'self'; object-src 'none';">

  <meta
    name="referrer"
    content="strict-origin-when-cross-origin">

  <meta
    name="description"
    content="Scott Collins MEng. Personal portfolio">

  <meta
    name="author"
    content="Scott Collins">

  <meta
    name="theme-color"
    content="#0E2F49">

  <meta
    property="og:title"
    content="Scott Collins MEng">

  <meta
    property="og:description"
    content="Personal portfolio">

  <meta
    property="og:type"
    content="website">

  <meta
    property="og:url"
    content="https://scottcollins.uk/">

  <title>Scott Collins MEng</title>

  <link
    rel="canonical"
    href="https://scottcollins.uk/">

  <link
    rel="icon"
    href="favicon.svg"
    type="image/svg+xml">

  <link
    rel="stylesheet"
    href="css/style.css">

  <script
    src="js/main.js"
    defer></script>

</head>

<body>

  <main class="card">

    <h1>Scott Collins MEng</h1>

    <span class="badge">
      Website Under Development
    </span>

    <div>
      <button
        type="button"
        class="btn-toggle"
        id="toggle-btn"
        aria-expanded="false"
        aria-controls="contact-wrapper">
        Contact Me
      </button>
    </div>

    <div
      class="form-wrapper"
      id="contact-wrapper">

      <form
        id="contact-form"
        action="https://formspree.io/f/mbgjzpvz"
        method="POST">

        <p class="field">
          <label for="f-name">
            Your name
          </label>

          <input
            id="f-name"
            name="name"
            type="text"
            autocomplete="name"
            maxlength="100"
            required>
        </p>

        <p class="field">
          <label for="f-email">
            Email
          </label>

          <input
            id="f-email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            required>
        </p>

        <p class="field">
          <label for="f-msg">
            Message
          </label>

          <textarea
            id="f-msg"
            name="message"
            rows="4"
            maxlength="3000"
            required></textarea>
        </p>

        <!-- Honeypot spam protection -->
        <p
          class="hp"
          aria-hidden="true">

          <label for="f-co">
            Company
          </label>

          <input
            id="f-co"
            name="_gotcha"
            type="text"
            tabindex="-1"
            autocomplete="off">

        </p>

        <div class="submit-row">

          <button
            type="submit"
            class="submit-btn">
            Send Message
          </button>

        </div>

      </form>

      <button
        type="button"
        class="music-control"
        id="music-control"
        aria-label="Play background music"
        aria-pressed="true">
        ▶
      </button>

    </div>

  </main>

  <audio
    id="site-audio"
    autoplay
    preload="auto">

    <source
      src="audio/downtempo-inspiring-hip-hop.mp3"
      type="audio/mpeg">

  </audio>

</body>
</html>
