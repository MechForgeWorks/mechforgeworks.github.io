<!DOCTYPE html>

<html lang="en-GB">
<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <!--
    The Content-Security-Policy and other security headers come
    from the _headers file (Cloudflare sends them as real HTTP headers).
  -->

  <meta
    name="description"
    content="Scott Collins MEng. Mechanical engineer, UK.">

  <meta
    name="author"
    content="Scott Collins">

  <meta
    name="color-scheme"
    content="dark">

  <meta
    name="theme-color"
    content="#0d0e10">

  <meta
    property="og:title"
    content="Scott Collins MEng">

  <meta
    property="og:description"
    content="Mechanical engineer, UK. Started in design, moved into quality, now in manufacturing.">

  <meta
    property="og:type"
    content="website">

  <meta
    property="og:url"
    content="https://scottcollins.uk/">

  <meta
    property="og:image"
    content="https://scottcollins.uk/og-image.jpg">

  <meta
    property="og:image:width"
    content="1200">

  <meta
    property="og:image:height"
    content="630">

  <meta
    property="og:image:alt"
    content="Scott Collins MEng, with a small production line where a part is designed, inspected and welded by a robot.">

  <meta
    name="twitter:card"
    content="summary_large_image">

  <meta
    name="robots"
    content="index, follow, noai, noimageai">

  <title>Scott Collins MEng</title>

  <link
    rel="canonical"
    href="https://scottcollins.uk/">

  <link
    rel="icon"
    href="favicon-32.png"
    sizes="32x32"
    type="image/png">

  <link
    rel="icon"
    href="favicon.svg"
    type="image/svg+xml">

  <link
    rel="apple-touch-icon"
    href="apple-touch-icon.png">

  <link
    rel="stylesheet"
    href="css/style.css">

  <noscript>
    <link
      rel="stylesheet"
      href="css/noscript.css">
  </noscript>

  <script
    src="js/main.js"
    defer></script>

  <!-- For search engines: name, title and address only, nothing more -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Person",
      "name": "Scott Collins",
      "honorificSuffix": "MEng",
      "jobTitle": "Mechanical engineer",
      "url": "https://scottcollins.uk/"
    }
  </script>

</head>

<body>

  <!-- The production line animation (drawn by js/main.js) -->
  <canvas class="line" id="line" aria-hidden="true"></canvas>

  <main class="page">

    <div class="intro">

      <h1>
        Scott Collins
        <span class="post">MEng</span>
      </h1>

      <p>
        Mechanical engineer, UK.<br>
        Started in design, moved into quality, now in manufacturing.<br>
        Currently seconded to a launch project.
      </p>

    </div>

    <div class="bottom">

    <p class="legal">&copy; 2026 Scott Collins</p>

    <div class="actions">

      <a
        class="cta"
        id="open-contact"
        href="#contact">
        Get in touch
      </a>

    </div>

    </div>

  </main>

  <dialog
    class="contact"
    id="contact"
    aria-labelledby="contact-title">

    <div class="sheet">

      <div class="sheet-head">

        <h2 id="contact-title">Get in touch</h2>

        <div class="sheet-tools">

        <button
          type="button"
          class="music"
          id="music"
          aria-pressed="false">

          <svg class="icon icon-play" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 2.5v11l9-5.5z"/>
          </svg>

          <svg class="icon icon-pause" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M4 2.5h3v11H4zM9 2.5h3v11H9z"/>
          </svg>

          Music

        </button>

        <a
          class="close"
          id="close-contact"
          href="#"
          aria-label="Close">

          <svg viewBox="0 0 16 16" aria-hidden="true">
            <path d="M3.5 3.5l9 9M12.5 3.5l-9 9"/>
          </svg>

        </a>

        </div>

      </div>

      <form
        id="contact-form"
        action="https://formspree.io/f/mbgjzpvz"
        method="POST">

        <fieldset class="field topics">
          <legend>What's it about?</legend>

          <div class="chips">
            <label class="chip">
              <input type="radio" name="topic" value="Work" required>
              <span>Work</span>
            </label>

            <label class="chip">
              <input type="radio" name="topic" value="CV request">
              <span>CV request</span>
            </label>

            <label class="chip">
              <input type="radio" name="topic" value="Just saying hi">
              <span>Just saying hi</span>
            </label>
          </div>
        </fieldset>

        <p class="field">
          <label for="f-name">Your name</label>

          <input
            id="f-name"
            name="name"
            type="text"
            autocomplete="name"
            maxlength="100"
            required>
        </p>

        <p class="field">
          <label for="f-email">Email</label>

          <input
            id="f-email"
            name="email"
            type="email"
            autocomplete="email"
            maxlength="254"
            required>
        </p>

        <p class="field">
          <label for="f-msg">Message</label>

          <textarea
            id="f-msg"
            name="message"
            rows="5"
            maxlength="3000"
            required></textarea>
        </p>

        <!-- Honeypot spam protection: hidden from people, bots fill it in -->
        <p
          class="hp"
          aria-hidden="true">

          <label for="f-hp">Leave this field empty</label>

          <input
            id="f-hp"
            name="_gotcha"
            type="text"
            tabindex="-1"
            autocomplete="off">

        </p>

        <button
          type="submit"
          class="send">
          Send message
        </button>

        <p
          class="form-status"
          id="form-status"
          role="status"></p>

        <p class="form-note">
          Sent via Formspree and used only to reply.
        </p>

      </form>

    </div>

  </dialog>

  <audio
    id="site-audio"
    preload="none"
    loop>

    <source
      src="audio/downtempo-inspiring-hip-hop.mp3"
      type="audio/mpeg">

  </audio>

</body>
</html>
